# Tiny Tapeout project information
project:
  title:        "ORACLE"
  author:       "Will (CHIP FOUNDRY)"
  discord:      ""
  description:  "Pong that plays itself: game + frozen int8 MLP policy, zero CPUs"
  language:     "SystemVerilog"
  clock_hz:     25000000

  tiles: "1x2"

  top_module:  "tt_um_patron_oracle01"

  source_files:
    - "tt_um_patron_oracle01.v"
    - "tt_top.sv"
    - "oracle_top.sv"
    - "policy_engine.sv"
    - "pong_core.sv"
    - "vga_timing.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "BTN_UP (left paddle up)"
  ui[1]: "BTN_DOWN (left paddle down)"
  ui[2]: "BTN_SERVE"
  ui[3]: "MODE_LOAD (weight load mode)"
  ui[4]: "LOAD_WE (serial write enable)"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "VGA RED"
  uo[1]: "VGA GREEN"
  uo[2]: "VGA BLUE"
  uo[3]: "VGA VSYNC"
  uo[4]: "VGA HSYNC"
  uo[5]: "GAME_STATE[0]"
  uo[6]: "GAME_STATE[1]"
  uo[7]: "GAME_STATE[2]"

  # Bidirectional pins
  uio[0]: "SERIAL_BIT (weight stream)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
